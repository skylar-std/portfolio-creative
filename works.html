  <main id="main" class="page">
    <div class="wrap">
      <header class="page__head">
        <p class="sec__en">Archive</p>
        <h1 class="page__title">전체 프로젝트 <span class="count" id="wkCount"></span></h1>
        <p class="page__lead" id="wkLead">지금까지 한 작업을 연도별로 정리했어요. 누르면 자세히 볼 수 있어요.</p>

      <!-- 거르기: 검색 · 분야(category) · 구분(kind) · 연도 -->
      <div class="arc-tools" id="arcTools">
        <label class="search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13M15.5 15.5L20 20" /></svg>

        <div class="arc-filter" id="fCat" role="group" aria-label="분야"></div>
        <div class="arc-filter" id="fKind" role="group" aria-label="구분"></div>
        <div class="arc-status">
          <p id="arcResult" aria-live="polite"></p>
          <button type="button" class="link-btn" id="arcReset" hidden>필터 초기화</button>
        </div>
      </div>

      <div class="arc-body">
        <nav class="arc-years" id="arcYears" aria-label="연도로 이동"></nav>
        <div id="archive"></div>
      </div>
    </div>
  </main>

  <footer class="foot">
