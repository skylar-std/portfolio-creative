<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | 박영희 Portfolio</title>
  <meta name="description" content="디자이너 박영희의 작업물 모음" />

  <meta property="og:title" content="Projects | 박영희 Design Portfolio" />
  <meta property="og:description" content="디자이너 박영희의 작업물 모음" />
  <meta property="og:image" content="img/og-image.svg" />

  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

  <!-- 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <!-- 스타일 -->
  <link rel="stylesheet" href="css/reset.css?v=20261001e" />
  <link rel="stylesheet" href="css/style.css?v=20261008f" />
  <link rel="stylesheet" href="css/responsive.css?v=20261001e" />

</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="logo" data-keep="index.html">PARK<span>.</span></a>

      <nav class="nav" id="nav">
        <a href="index.html#profile" class="nav__link" data-keep="index.html#profile">About</a>
        <a href="works.html" class="nav__link is-current" aria-current="page">Projects</a>
      </nav>

      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">

    <!-- ===== Projects : 무엇을 했고 어떤 능력이 있는지 ===== -->
    <section class="section works archive--page" id="works">
      <div class="container">
        <div class="works__head reveal">
          <h1 class="page-title">Projects</h1>
          <p class="works__lead">어떤 작업을 했고, 그 안에서 제가 무엇을 맡았는지 정리했어요. 이미지를 누르면 자세히 볼 수 있어요.</p>
        </div>

        <!-- 한눈에 보는 능력: js/projects.js 의 category · tools 로 자동 계산 -->
        <div class="overview reveal" aria-label="한눈에 보기">
          <div class="overview__count"><strong id="ovCount">0</strong><span>Projects</span></div>
          <div class="overview__block">
            <p class="overview__label">작업 분야</p>
            <ul class="overview__fields" id="ovFields"></ul>
          </div>
          <div class="overview__block">
            <p class="overview__label">많이 쓴 도구</p>
            <ul class="overview__tools" id="ovTools"></ul>
          </div>
        </div>

        <div class="view-toggle reveal" id="viewToggle" role="tablist" aria-label="보기 방식: 프로젝트 또는 아카이브">
          <button type="button" role="tab" data-view="cards" aria-selected="true">프로젝트</button>
          <button type="button" role="tab" data-view="timeline" aria-selected="false">아카이브</button>
        </div>
        <div class="filter reveal" id="filter" role="group" aria-label="분야로 보기"></div>
        <div class="works__list" id="worksList"></div>

        <!-- 날짜별로 한 번에 보기: date 값으로 연도별 자동 정리 -->
        <section class="yarch yarch--tab reveal" id="timeline" hidden aria-labelledby="timelineTitle">
          <div class="yarch__head">
            <h2 class="yarch__title" id="timelineTitle">아카이브</h2>
            <p class="yarch__lead">언제, 어떤 순서로 작업했는지 한 번에 볼 수 있어요. 누르면 위의 작업으로 이동해요.</p>
          </div>
          <div class="yarch__years" id="timelineList"></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="footer footer--light">
    <div class="container footer__inner">
      <p>© <span id="year"></span> PARK Younghee. All rights reserved.</p>
      <a href="#top" class="footer__top">Back to top ↑</a>
    </div>
  </footer>

  <!-- ===== Project Modal ===== -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <article class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" data-close aria-label="닫기">✕</button>
      <!-- 케이스 스터디: DB projects.detail 이 있는 프로젝트만 여기에 그려져요 -->
      <div class="cs" id="modalCase" hidden></div>
      <img class="modal__img" id="modalImg" src="" alt="" />
      <div class="modal__body">
        <p class="modal__meta" id="modalMeta"></p>
        <h3 class="modal__title" id="modalTitle"></h3>
        <p class="modal__desc" id="modalDesc"></p>
        <ul class="modal__tags" id="modalTags"></ul>
        <a class="btn btn--primary modal__link" id="modalLink" href="#" target="_blank" rel="noopener">자세히 보기 ↗</a>
      </div>
    </article>
  </div>

  <!-- 스크립트 (순서 중요: 데이터 → 작업물 페이지 → 공통) -->
  <script src="js/db.js?v=20261008f"></script>
  <script src="js/data.js?v=20261008f"></script>
  <script src="js/works.js?v=20261008f"></script>
  <script src="js/main.js?v=20261008f"></script>
</body>
</html>
